name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - name: APK'yı indirme sayfasına koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HizGostergesi.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest HizGostergesi.apk \
            --title "Hız Göstergesi" \
            --notes "Otomatik derlendi. HizGostergesi.apk dosyasını indirip kur."
