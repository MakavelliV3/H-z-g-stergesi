name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Birim testleri ve lint
        id: tests
        continue-on-error: true
        run: gradle testDebugUnitTest lintDebug --no-daemon --continue 2>&1 | tee test.log

      - name: Raporları yayınla
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rapor
          cp test.log rapor/test.log || true
          cp app/build/reports/lint-results-debug.txt rapor/lint.txt || echo "lint raporu yok" > rapor/lint.txt
          cat app/build/test-results/testDebugUnitTest/*.xml > rapor/unit-tests.xml 2>/dev/null || echo "test sonucu yok" > rapor/unit-tests.xml
          gh release view reports > /dev/null 2>&1 || gh release create reports --prerelease \
            --title "Test ve lint raporları" --notes "Son derlemenin birim testi ve lint raporları" || true
          gh release upload reports rapor/test.log rapor/lint.txt rapor/unit-tests.xml --clobber || true

      - name: Testler geçti mi?
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Birim testleri ya da derleme başarısız" | tee build.log
          tail -80 test.log >> build.log
          exit 1

      - name: APK derle
        run: gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: APK'yı indirme sayfasına koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk HizGostergesi.apk
          gh release view latest > /dev/null 2>&1 || gh release create latest \
            --title "Hız Göstergesi" --notes "Otomatik derlendi. HizGostergesi.apk dosyasını indirip kur."
          for i in 1 2 3; do gh release upload latest HizGostergesi.apk --clobber && break; sleep 10; done

      - name: Hata kaydını yayınla
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build.log ] || echo "Derleme kaydı yok (hata rapor yükleme adımında olabilir)" > build.log
          gh release view build-log > /dev/null 2>&1 || gh release create build-log --prerelease \
            --title "Derleme hatası" --notes "Son başarısız derlemenin kaydı" || true
          gh release upload build-log build.log --clobber || true

  emulator:
    # Emülatör testi uzun sürer (~15-20 dk): sadece commit mesajında [emu] varsa ya da elle başlatılınca çalışır
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emu]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: KVM'yi aç
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test APK'larını önceden derle
        id: devbuild
        continue-on-error: true
        run: gradle assembleDebug compileDebugAndroidTestKotlin assembleDebugAndroidTest --no-daemon 2>&1 | tee compile.log; test ${PIPESTATUS[0]} -eq 0

      - name: Android 14 emülatöründe uçtan uca test
        if: steps.devbuild.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb logcat -c || true
            gradle connectedDebugAndroidTest --no-daemon --continue > device.log 2>&1 || echo "TESTLER_BASARISIZ" >> device.log
            adb logcat -d -v time > logcat-full.txt || true
            grep -E "AndroidRuntime|FATAL|hizgostergesi|ANR" logcat-full.txt | tail -n 600 > logcat.txt || true
            adb pull /data/local/tmp/shots shots || true

      - name: Cihaz testi raporunu yayınla
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p cihaz
          [ -f compile.log ] && tail -n 300 compile.log > cihaz/compile.log || echo "derleme kaydı yok" > cihaz/compile.log
          [ -f device.log ] && cp device.log cihaz/device.log || echo "test çalışmadı" > cihaz/device.log
          [ -f logcat.txt ] && cp logcat.txt cihaz/logcat.txt || echo "logcat yok" > cihaz/logcat.txt
          find app/build -name "*.xml" -path "*androidTest-results*" -exec cat {} + > cihaz/device-tests.xml 2>/dev/null
          [ -s cihaz/device-tests.xml ] || echo "sonuç yok" > cihaz/device-tests.xml
          gh release view device-tests > /dev/null 2>&1 || gh release create device-tests --prerelease --title "Emülatör testleri" --notes "Android 14 emülatöründe uçtan uca test sonuçları"
          gh release upload device-tests cihaz/compile.log cihaz/device.log cihaz/logcat.txt cihaz/device-tests.xml --clobber
          if [ -d shots ]; then tar czf cihaz/shots.tar.gz -C shots . && gh release upload device-tests cihaz/shots.tar.gz --clobber; fi
          exit 0
